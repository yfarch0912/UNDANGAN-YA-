<!-- Frame HP preview UndangYa! — dari mockup_hp_template.svg kiriman user 2026-11-14 (placeholder & panduan dibuang; sasis & bezel dilubangi evenodd tepat di area layar 392x832 sehingga transparan untuk iframe) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 880" width="440" height="880" fill="none">
  <defs>
    <!-- Metallic Titanium Outer Rim Gradient (Dark Violet-Graphite matching reference) -->
    <linearGradient id="frame-metallic" x1="0" y1="0" x2="440" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A4E6A"/>
      <stop offset="18%" stop-color="#2D2638"/>
      <stop offset="50%" stop-color="#473E56"/>
      <stop offset="82%" stop-color="#231E2B"/>
      <stop offset="100%" stop-color="#524663"/>
    </linearGradient>

    <!-- Subtle Inner Rim Highlight -->
    <linearGradient id="rim-highlight" x1="220" y1="12" x2="220" y2="868" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A7B9E" stop-opacity="0.75"/>
      <stop offset="15%" stop-color="#3A3247" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#3A3247" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7B6C8F" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Side Button Metallic Gradient -->
    <linearGradient id="button-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B5E7D"/>
      <stop offset="50%" stop-color="#3E354B"/>
      <stop offset="100%" stop-color="#25202E"/>
    </linearGradient>

    <!-- Camera Lens Gradient -->
    <radialGradient id="camera-lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#293B6B"/>
      <stop offset="45%" stop-color="#131A2E"/>
      <stop offset="75%" stop-color="#090B12"/>
      <stop offset="100%" stop-color="#1E2438"/>
    </radialGradient>

    <!-- Optional Subtle Placeholder Screen Background (Safe to hide/replace) -->
    <linearGradient id="placeholder-bg" x1="22" y1="22" x2="418" y2="858" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F5FA"/>
      <stop offset="100%" stop-color="#EAE5F2"/>
    </linearGradient>

    <!-- Subtle Glass Reflection Overlay -->
    <linearGradient id="glass-glare" x1="22" y1="22" x2="350" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Screen Clip Path (Place your UI/template artwork inside a group using this clip-path) -->
    <clipPath id="screen-clip">
      <rect x="24" y="24" width="392" height="832" rx="52" ry="52"/>
    </clipPath>
  </defs>

  <!-- 1. SIDE HARDWARE BUTTONS -->
  <g id="side-buttons">
    <!-- Left: Action Button -->
    <rect x="8" y="152" width="4" height="32" rx="2" fill="url(#button-metal)"/>
    <!-- Left: Volume Up -->
    <rect x="8" y="206" width="4" height="62" rx="2" fill="url(#button-metal)"/>
    <!-- Left: Volume Down -->
    <rect x="8" y="282" width="4" height="62" rx="2" fill="url(#button-metal)"/>
    <!-- Right: Power / Side Button -->
    <rect x="428" y="232" width="4" height="92" rx="2" fill="url(#button-metal)"/>
  </g>

  <!-- 2. OUTER PHONE BODY & BEZEL -->
  <g id="outer-frame">
    <!-- Outer Metallic Chassis -->
    <path d="M 75 11 H 365 A 64 64 0 0 1 429 75 V 805 A 64 64 0 0 1 365 869 H 75 A 64 64 0 0 1 11 805 V 75 A 64 64 0 0 1 75 11 Z M 75.0 15.5 H 365.0 A 59.5 59.5 0 0 1 424.5 75.0 V 805.0 A 59.5 59.5 0 0 1 365.0 864.5 H 75.0 A 59.5 59.5 0 0 1 15.5 805.0 V 75.0 A 59.5 59.5 0 0 1 75.0 15.5 Z" fill="url(#frame-metallic)" fill-rule="evenodd"/>
    <!-- Subtle Metallic Edge Stroke -->
    <rect x="12" y="12" width="416" height="856" rx="63" ry="63" stroke="url(#rim-highlight)" stroke-width="1.5"/>
    <!-- Inner Black Glass Bezel -->
    <path d="M 75.0 15.5 H 365.0 A 59.5 59.5 0 0 1 424.5 75.0 V 805.0 A 59.5 59.5 0 0 1 365.0 864.5 H 75.0 A 59.5 59.5 0 0 1 15.5 805.0 V 75.0 A 59.5 59.5 0 0 1 75.0 15.5 Z M 76 24 H 364 A 52 52 0 0 1 416 76 V 804 A 52 52 0 0 1 364 856 H 76 A 52 52 0 0 1 24 804 V 76 A 52 52 0 0 1 76 24 Z" fill="#0A0A0C" fill-rule="evenodd"/>
    <!-- Fine Inner Bezel Step -->
    <rect x="22.5" y="22.5" width="395" height="835" rx="53.5" ry="53.5" stroke="#1E1E24" stroke-width="1"/>
  </g>

  <!-- 3. SCREEN TEMPLATE AREA (Clipped to rounded display) -->
  <g id="screen-area" clip-path="url(#screen-clip)">

    <!-- Optional Status Bar (Dark icons for light backgrounds; change fill to #FFFFFF for dark backgrounds) -->
    <g id="status-bar" fill="#1C1924">
      <!-- Time -->
      <text x="66" y="59" text-anchor="middle" font-family="system-ui, -apple-system, 'SF Pro Text', sans-serif" font-size="14" font-weight="600" letter-spacing="-0.2">17.49</text>

      <!-- Cellular Signal Bars -->
      <g id="icon-signal" transform="translate(310, 48)">
        <rect x="0" y="7" width="3" height="4" rx="1"/>
        <rect x="4.5" y="5" width="3" height="6" rx="1"/>
        <rect x="9" y="2.5" width="3" height="8.5" rx="1"/>
        <rect x="13.5" y="0" width="3" height="11" rx="1"/>
      </g>

      <!-- Wi-Fi Icon -->
      <g id="icon-wifi" transform="translate(332, 48)">
        <path d="M8.5 9.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/>
        <path d="M5.1 7.8a4.8 4.8 0 0 1 6.8 0" stroke="#1C1924" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M2.6 5.2a8.4 8.4 0 0 1 11.8 0" stroke="#1C1924" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M0.3 2.7a11.8 11.8 0 0 1 16.4 0" stroke="#1C1924" stroke-width="1.6" stroke-linecap="round"/>
      </g>

      <!-- Battery Icon -->
      <g id="icon-battery" transform="translate(355, 48)">
        <rect x="0.75" y="0.75" width="22.5" height="10.5" rx="3" stroke="#1C1924" stroke-opacity="0.4" stroke-width="1.2"/>
        <rect x="2.5" y="2.5" width="17" height="7" rx="1.5"/>
        <path d="M24.5 4.2v3.6a1.4 1.4 0 0 0 0-3.6z" opacity="0.5"/>
      </g>
    </g>

    <!-- Subtle Screen Glass Glare (Optional) -->
    <path id="screen-glare" d="M24 24 H280 L110 856 H24 Z" fill="url(#glass-glare)" pointer-events="none"/>
  </g>

  <!-- 4. DYNAMIC ISLAND & FRONT SENSORS (Always on top of screen content) -->
  <g id="dynamic-island">
    <!-- Top Speaker Slit -->
    <rect x="194" y="16.5" width="52" height="3" rx="1.5" fill="#16161B"/>
    <!-- Dynamic Island Pill -->
    <rect x="160" y="38" width="120" height="33" rx="16.5" fill="#050507"/>
    <rect x="160.5" y="38.5" width="119" height="32" rx="16" stroke="#1B1B22" stroke-width="1"/>
    <!-- Front Camera Lens -->
    <circle cx="257" cy="54.5" r="8" fill="#0E0E14"/>
    <circle cx="257" cy="54.5" r="5" fill="url(#camera-lens)"/>
    <circle cx="255.2" cy="52.7" r="1.4" fill="#6384D6" opacity="0.55"/>
  </g>
</svg>