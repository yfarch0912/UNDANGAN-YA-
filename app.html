  <style>
    body {
      font-family: 'Jost', sans-serif;
      background-color: #FAF7F2;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(197, 160, 89, 0.08) 0%, transparent 45%),

    .botanical-card {
      background: linear-gradient(180deg, rgba(255,253,249,0.96) 0%, rgba(250,247,242,0.94) 100%);
      border: 1px solid #E2D9C8;
      box-shadow: 0 12px 32px -12px rgba(24, 46, 37, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    @keyframes floatBotanical {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }

    .animate-float-botanical {
      animation: floatBotanical 6s ease-in-out infinite;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #F1E8D8;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #DCC5A0;
      border-radius: 9999px;
    }
    .phone-frame {
      box-shadow: 0 25px 50px -12px rgba(33, 20, 15, 0.28), inset 0 0 0 2px rgba(255,255,255,0.15);
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-disc {
      animation: spinSlow 8s linear infinite;
    }

  <style>
    /* Gerbang sesi UndangYa! — dashboard hanya untuk pengguna yang sudah masuk. */
    #uyVeil{position:fixed;inset:0;z-index:99999;background:#FBF7EF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:'Jost',sans-serif;color:#410D19}
    #uyVeil .uy-veil-brand{font-family:'Cormorant Garamond',serif;font-size:2rem;letter-spacing:.14em}
    #uyVeil .uy-veil-brand b{color:#A8823C}
    #uyVeil p{font-size:.85rem;color:#7D6C52;letter-spacing:.05em;margin:0}
  </style>
  <script>
    /* Gerbang sesi: periksa /api/auth/me SEBELUM dashboard dipakai.
       Belum masuk -> alihkan ke login (kembali ke app setelah masuk). */
    window.__uySession = fetch('/api/auth/me', { headers: { 'Accept': 'application/json' } })
      .then(function (r) {
        if (!r.ok) { window.location.replace('login?next=app'); return null; }
        return r.json();
      })
      .then(function (d) {
        if (!d || !d.user) return null;
        window.__uyUser = d.user;
        document.dispatchEvent(new CustomEvent('uy:session', { detail: d.user }));
        var v = document.getElementById('uyVeil');
        if (v) v.remove();
        return d.user;
      })
      .catch(function () { window.location.replace('login?next=app'); });
  </script>

    function showToast(msg, type = "success") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const el = document.createElement("div");
      const colors = {
        success: "bg-slate-900 text-white border-emerald-500/40",
        info: "bg-indigo-950 text-white border-indigo-400/40",
        warn: "bg-amber-950 text-amber-100 border-amber-400/40"
      };
      el.className = `pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-2xl shadow-xl border ${colors[type] || colors.success} text-xs font-semibold transition-all duration-300`;
      el.innerHTML = `
        <div class="flex items-center gap-2.5">
          <span>${type === "success" ? "" : type === "warn" ? "" : ""}</span>
          <span>${msg}</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white ml-2">✕</button>
      `;
      container.appendChild(el);
      setTimeout(() => {
        if (el && el.parentElement) el.remove();
      }, 3600);
    }

    function copyTextToClipboard(text, label = "Tautan") {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast(`${label} berhasil disalin: ${text}`);
          }).catch(() => fallbackCopy(text, label));
        } else {
          fallbackCopy(text, label);
        }
      } catch (e) {
        fallbackCopy(text, label);
      }
    }

    function fallbackCopy(text, label) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      showToast(`${label} berhasil disalin: ${text}`);
    }

    function duplicateInvitation(invId) {
      if (uyProjectLimitReached()) { uyShowUpgradeModal(); return; }
      const orig = REA_Repository.getInvitationById(invId);
      if (!orig) return;
      const copy = JSON.parse(JSON.stringify(orig));
      copy.id = "inv-" + Date.now();
      copy.slug = Math.random().toString(16).slice(2, 10) + "-4c5c";
      copy.title = orig.title + " (Salinan)";
      copy.status = "Draf";
      copy.updatedAt = "Baru saja";
      UndangyaREA.events.invitations.unshift(copy);
      REA_Repository.save();
      renderDashboardView();
      showToast(`Undangan "${copy.title}" berhasil diduplikasi.`);
    }

    function confirmCreateNewInvitationFromWizard() {
      if (uyProjectLimitReached()) { uyShowUpgradeModal(); return; }
      const newInv = JSON.parse(JSON.stringify(UndangyaREA.events.invitations[0]));
      newInv.id = "inv-" + Date.now();
      newInv.slug = Math.random().toString(16).slice(2, 10) + "-9422";
      newInv.cleanSlug = (wizardState.title || "undangan-baru").toLowerCase().replace(/[^a-z0-9]+/g, "-");
      newInv.title = wizardState.title || "Undangan Pernikahan";
      newInv.eventType = wizardState.eventType;
      newInv.templateId = wizardState.selectedTemplateId;
      newInv.status = "Draf";
      newInv.updatedAt = "Baru saja";
      UndangyaREA.events.invitations.unshift(newInv);
      REA_Repository.save();
      showToast("Draf undangan berhasil dibuat! Silakan lengkapi detail acaramu.");
      openInvitationEditor(newInv.id, "tampilan");
    }

    function buildViewTemplateCatalog() {
      const categories = ["Semua kategori", "Ilustrasi 2D", "Taman Interaktif", "Islami", "Adat Jawa", "Adat Bali", "Royal Klasik", "Botani", "3D Interaktif", "Sinematik", "Retro Musik", "Perjalanan", "Surat & Amplop", "Galeri Seni", "Surat Kabar", "Petualangan", "Apotek Vintage", "Radio Retro", "Astronomi", "Kafe", "Permainan", "Bawah Laut", "Festival"];
      const filtered = TEMPLATE_CATALOG.filter(t => {
        const matchTier = tplFilterTier === "Semua level" || t.tier === tplFilterTier;
        const matchCat = tplFilterCategory === "Semua kategori" || t.category === tplFilterCategory;
        const q = tplSearchQuery.trim().toLowerCase();
        const matchQ = !q || t.name.toLowerCase().includes(q) || t.category.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q);
        return matchTier && matchCat && matchQ;
      });

      return `
        <div class="max-w-7xl mx-auto space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <p class="text-xs text-slate-400 font-medium">Dasbor / <span class="text-slate-700 font-semibold">Pilihan Template</span></p>

            </div>
            <button type="button" onclick="startCreateInvitationWizard()" class="px-4 py-2.5 rounded-xl bg-slate-950 hover:bg-indigo-600 text-white font-bold text-xs shadow-sm">
              + Buat Undangan Baru
            </button>
          </div>

          <div class="bg-white rounded-3xl border border-slate-200/80 p-5 shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <input
                type="text"
                value="${tplSearchQuery}"
                oninput="tplSearchQuery = this.value; renderDashboardView()"
                placeholder="Cari nama atau tema template..."
                class="w-full sm:max-w-md px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"
              />
              <div class="flex items-center gap-1.5">
                ${["Semua level", "Basic", "Premium", "Luxury"].map(lvl => `
                  <button type="button" onclick="tplFilterTier = '${lvl}'; renderDashboardView()" class="px-3 py-1.5 rounded-full text-xs font-bold ${tplFilterTier === lvl ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">${lvl}</button>
                `).join("")}
              </div>
            </div>

            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-1.5 overflow-x-auto custom-scroll pb-1">
                ${categories.map(cat => `
                  <button type="button" onclick="tplFilterCategory = '${cat}'; renderDashboardView()" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border transition ${tplFilterCategory === cat ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
                    ${cat === "Semua kategori" ? "Semua" : cat}
                  </button>
                `).join("")}
              </div>
              <span class="text-xs font-bold text-slate-500">${filtered.length} template</span>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            ${filtered.map(t => `
              <div class="bg-white rounded-3xl border border-slate-200/90 overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col justify-between">
                <div>
                  <div class="relative h-48 overflow-hidden">
                    <img src="${t.image}" alt="${t.name}" class="w-full h-full object-cover" />
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
                    <span class="absolute bottom-3 left-3 px-2.5 py-0.5 rounded-full text-[10px] font-bold ${t.tier === 'Luxury' ? 'bg-slate-950 text-amber-300 border border-amber-400/40' : t.tier === 'Premium' ? 'bg-amber-100 text-amber-900' : 'bg-emerald-100 text-emerald-900'}">
                      ${t.tier}
                    </span>
                  </div>
                  <div class="p-4">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${t.category}</p>
                    <h3 class="text-sm font-extrabold text-slate-900 mt-0.5">${t.name}</h3>
                    <p class="text-xs text-slate-500 line-clamp-2 mt-1">${t.desc}</p>
                  </div>
                </div>
                <div class="p-4 pt-0 flex items-center gap-2">
                  <button type="button" onclick="previewTemplateModal('${t.id}')" class="flex-1 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-xs font-bold text-slate-700">
                    Preview

                  <button type="button" onclick="useTemplateFromCatalog('${t.id}')" class="flex-1 py-2 rounded-xl bg-slate-950 hover:bg-indigo-600 text-white text-xs font-bold">
                    Gunakan
                  </button>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

      startCreateInvitationWizard(tplId);

    // === UNDANGYA CUSTOM: unggah foto sendiri dari perangkat (diperkecil otomatis agar hemat penyimpanan) ===
    function uyReadPhotoFile(file, cb) {
      if (!file) return;
      if (!/^image\//.test(file.type)) { showToast("File harus berupa gambar (JPG/PNG/WebP)."); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 850; let w = img.width, hg = img.height;
          if (w > max || hg > max) { const r = max / Math.max(w, hg); w = Math.round(w * r); hg = Math.round(hg * r); }
          const c = document.createElement("canvas"); c.width = w; c.height = hg;
          c.getContext("2d").drawImage(img, 0, 0, w, hg);
          cb(c.toDataURL("image/jpeg", 0.82));
        };
        img.onerror = () => showToast("Foto tidak bisa dibaca — coba file lain.");
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    function uploadPersonPhoto(role, input) {
      const inv = REA_Repository.getInvitationById(activeInvitationId);
      if (!inv || !input.files || !input.files[0]) return;
      uyReadPhotoFile(input.files[0], (url) => { inv[role].photo = url; REA_Repository.save(); renderDashboardView(); showToast("Foto mempelai dari perangkatmu berhasil dipasang."); });
    }
    function uploadCoverPhoto(input) {
      const inv = REA_Repository.getInvitationById(activeInvitationId);
      if (!inv || !input.files || !input.files[0]) return;
      uyReadPhotoFile(input.files[0], (url) => { inv.coverPhoto = url; REA_Repository.save(); renderDashboardView(); showToast("Foto cover berhasil diganti dengan fotomu."); });
    }
    function uploadGalleryPhotos(input) {
      const inv = REA_Repository.getInvitationById(activeInvitationId);
      if (!inv || !input.files || !input.files.length) return;
      inv.gallery = inv.gallery || [];
      const files = [...input.files].slice(0, Math.max(0, 10 - inv.gallery.length));
      if (!files.length) { showToast("Galeri sudah penuh (maksimal 10 foto)."); return; }
      let done = 0;
      files.forEach(f => uyReadPhotoFile(f, (url) => { inv.gallery.push(url); if (++done === files.length) { REA_Repository.save(); renderDashboardView(); showToast(files.length + " foto berhasil diunggah ke galeri."); } }));
    }

    function togglePlaySynthesizedMusic(mId) {
      if (playingMusicId === mId) {
        if (musicInterval) clearInterval(musicInterval);
        playingMusicId = null;
        renderDashboardView();
        return;
      }
      if (musicInterval) clearInterval(musicInterval);
      playingMusicId = mId;
      const track = MUSIC_LIBRARY.find(m => m.id === mId) || MUSIC_LIBRARY[0];

      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let step = 0;
        const playNote = () => {
          if (!playingMusicId) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(track.freq[step % track.freq.length], audioCtx.currentTime);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.55);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.6);
          step++;
        };
        playNote();
        musicInterval = setInterval(playNote, 650);
      } catch (e) {}

      renderDashboardView();
      showToast(`Memutar pratinjau musik: ${track.title} `, "info");
    }

      UndangyaREA.events.openEvents.unshift({
        id: "evt-" + Date.now(),
        slug: title.toLowerCase().replace(/[^a-z0-9]+/g, "-"),
        title,
        category,
        visualTheme,
        dateLabel: "Minggu, 20 Desember 2026 · 09:00 WIB",
        location,
        status: "Aktif",
        capacity: 100,
        registered: 1,
        checkedIn: 0,
        speakers: ["Yusuf Fahrezzi"],
        agenda: ["09:00 Pembukaan & Registrasi QR"],
        participants: [{ code: "UDG-QR-101", name: "Peserta Perdana", email: "halo@undangya.web.id", checkedIn: false }]

      REA_Repository.save();
      closeModal();
      renderDashboardView();
      showToast(`Halaman Event "${title}" berhasil diterbitkan!`);

    function submitGuestRsvpFromPreview(invId) {
      const inv = REA_Repository.getInvitationById(invId);
      const guestName = (document.getElementById("guest-rsvp-name") || {}).value.trim() || "Tamu Kehormatan";
      const attendance = (document.getElementById("guest-rsvp-status") || {}).value || "Hadir";
      const pax = Number((document.getElementById("guest-rsvp-pax") || {}).value || 2);
      const message = (document.getElementById("guest-rsvp-msg") || {}).value.trim() || "Selamat berbahagia dan semoga samawa!";

      inv.wishes.unshift({ id: "w-" + Date.now(), guestName, attendance, pax, message, createdAt: "Baru saja" });
      UndangyaREA.notifications.unshift({
        id: "n-" + Date.now(),
        text: `${guestName} mengirim RSVP (${attendance} - ${pax} org): "${message}"`,
        time: "Baru saja",
        read: false
      });
      REA_Repository.save();
      closeModal();
      renderDashboardView();
      showToast(`RSVP & ucapan dari "${guestName}" berhasil masuk ke Dasbor!`);
    }

          </div>

      `);

    function resetReaStore() {
      try {
        localStorage.removeItem("undangya_rea_store_v1");
      } catch (e) {}
      closeModal();
      showToast("Data penyimpanan direset ke awal.", "info");
    }

    document.addEventListener("click", (e) => {
      const searchBox = document.getElementById("global-search-input");
      const searchDd = document.getElementById("global-search-dropdown");
      if (searchDd && searchBox && !searchBox.contains(e.target) && !searchDd.contains(e.target)) {
        searchDd.classList.add("hidden");
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      renderNotificationsList();
      renderDashboardView();
    });
  </script>
  <script>
    /* Identitas sesi asli -> header & data pengguna aplikasi; tombol Keluar asli. */
    function uyApplyUser(u) {
      if (!u) return;
      var name = u.name || 'Pengguna';
      var hn = document.getElementById('header-user-name'); if (hn) hn.textContent = name;
      var dn = document.getElementById('dropdown-user-name'); if (dn) dn.textContent = name;
      var de = document.getElementById('dropdown-user-email'); if (de) de.textContent = u.email || '';
      try {
        if (typeof UndangyaREA !== 'undefined' && UndangyaREA.agents && UndangyaREA.agents.currentUser) {
          UndangyaREA.agents.currentUser.name = name;
          if (u.email) UndangyaREA.agents.currentUser.email = u.email;
        }
      } catch (e) {}
      var fake = document.querySelector('button[onclick*="Sesi simulasi"]');
      if (fake && !fake.dataset.uyLogout) {
        fake.dataset.uyLogout = '1';
        fake.removeAttribute('onclick');
        fake.textContent = 'Keluar';
        fake.addEventListener('click', function () {
          fetch('/api/auth/logout', { method: 'POST' })
            .then(function () { window.location.replace('index'); })
            .catch(function () { window.location.replace('index'); });
        });
      }
    }
    if (window.__uyUser) uyApplyUser(window.__uyUser);
    document.addEventListener('uy:session', function (e) { uyApplyUser(e.detail); });
  </script>
